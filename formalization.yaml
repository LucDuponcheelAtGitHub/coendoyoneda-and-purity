  statements:
    - source: "Proposition 2.4 (prop:eta-eq-T)"
      lean: "CoEndoYonedaAndPurity.η_eq_T"
      module: "Solution"
      status: "proved"
      note: "Derives the terminal unit law η.app (FF.obj T) = g (g tt*) from the general parametric law η_eq."
    - source: "Theorem 3.4(i) (thm:coendoyoneda)"
      lean: "CoEndoYonedaAndPurity.fz_to_τz_commute"
      module: "Solution"
      status: "proved"
      note: "Proves naturality of the reconstructed transformation fz_to_τz_hom."
    - source: "Theorem 3.4(ii) (thm:coendoyoneda)"
      lean: "CoEndoYonedaAndPurity.to_from_proof_hom"
      module: "Solution"
      status: "proved"
      note: "Proves the section property τz_to_fz (fz_to_τz fz) = fz of the CoEndoYoneda isomorphism."
    - source: "Theorem 3.4(iii) (thm:coendoyoneda)"
      lean: "CoEndoYonedaAndPurity.from_to_proof'"
      module: "Solution"
      status: "proved"
      note: "Proves the retraction property fz_to_τz (τz_to_fz τz) = τz componentwise."
    - source: "Proposition 3.5 (prop:origin-eta)"
      lean: "CoEndoYonedaAndPurity.ηFFT_is_η_at_FFT"
      module: "Solution"
      status: "proved"
      note: "Proves that the CoEndoYoneda image of id_G recovers η.app (FF.obj T)."
    - source: "Proposition 3.6 (prop:set-fc)"
      lean: "CoEndoYonedaAndPurity.set_is_functional_category"
      module: "Solution"
      status: "proved"
      note: "Establishes that Type u with the identity functor is a Functional Category."
    - source: "Lemma 4.2 (lem:idem-ispure)"
      lean: "CoEndoYonedaAndPurity.idempotent_iff_isPure"
      module: "Solution"
      status: "proved"
      note: "Proves equivalence of Idempotent M and IsPure M."
    - source: "Theorem 4.3 (thm:kleisli-purity)"
      lean: "CoEndoYonedaAndPurity.kleisliBasicFunctionalCategory_iff_idempotent"
      module: "Solution"
      status: "proved"
      note: "Proves that KleisliCat M with KFF M is a Basic Functional Category iff M is an idempotent monad."
    - source: "Theorem 4.4 (thm:terminal-subsingleton)"
      lean: "CoEndoYonedaAndPurity.isPure_implies_monadicTerminalTypeSubSingleton"
      module: "Solution"
      status: "proved"
      note: "Derives directly from IsPure M that every mt : M T equals pure tt* (and hence M T is a subsingleton)."
    - source: "Theorem 5.1 (thm:examples)"
      lean: "CoEndoYonedaAndPurity.maybe_not_pure"
      module: "Solution"
      status: "proved"
      note: "Proves that Option/Maybe is not pure (along with list_not_pure, read/write/state/cont_purity_implies, and io_not_pure)."

