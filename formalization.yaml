version: "v0.4"

project:
  name: "The CoEndoYoneda Lemma and its Relationship to Purity for Kleisli Categories with an Idempotent Monad"
  description: >-
    Formalization of Basic Functional Categories, Functional Categories, the
    pointfree CoEndoYoneda Isomorphism Theorem, and its equivalence with
    computational purity (monad idempotency) for Kleisli categories. Given a
    category C and a functional functor FF : Type u ⥤ C, we define the
    CoYoneda endofunctor CYEF(Z) = CYF(Z) ⋙ FF, the global-like endofunctor
    G = CYEF(FF(T)), and prove the CoEndoYoneda isomorphism
    (CYEF(Z) ⟶ (EF ⋙ G)) ≃ (FF(T) ⟶ G(EF(Z))). We prove that evaluating the
    forward isomorphism on id_G recovers the terminal unit component
    η.app(FF(T)), verify that Type u with the identity functor is a canonical
    Functional Category, and prove that for the Kleisli category KleisliCat M
    of a lawful monad M with canonical identity-on-objects functor KFF,
    BasicFunctionalCategory (KleisliCat M) (KFF M) holds if and only if M is an
    idempotent (pure) monad. Finally, we derive the terminal subsingleton
    theorem (IsPure M → Subsingleton (M T)) and classify seven standard
    computational effects (Option, List, Read, Write, State, Cont, and
    ErrorState/IO).
  authors:
    - "Luc Duponcheel"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Luc Duponcheel"

